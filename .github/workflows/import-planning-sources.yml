name: Import planning sources
on:
  push:
    branches:
      - docs/import-all-plans-20260912
    paths:
      - .plan-transfer/READY.json
permissions:
  contents: write
concurrency:
  group: semekome-planning-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/docs/import-all-plans-20260912'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the documentation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Verify and expand all source documents
        run: python3 .plan-transfer/import_sources.py
      - name: Commit restored documents to this branch only
        env:
          TARGET_BRANCH: docs/import-all-plans-20260912
        run: |
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs README.md AGENTS.md
          git rm -r .plan-transfer
          git commit -m 'docs: restore all four versions of planning sources with integrity checks'
          git push origin "HEAD:$TARGET_BRANCH"
