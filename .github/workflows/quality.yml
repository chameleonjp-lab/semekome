name: Public page verification

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  public_page:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the existing public page and real receipt
        run: node scripts/check-published-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-page-verification
          path: public-verification/
          retention-days: 14
