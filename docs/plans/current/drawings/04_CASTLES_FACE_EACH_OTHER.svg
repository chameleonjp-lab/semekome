"middle" font-weight="400">弾薬庫B</text><rect x="1275.0" y="422" width="60" height="76" fill="#e7ecd8" stroke="none" stroke-width="1" rx="0"/><text x="1305" y="465" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#192f42" text-anchor="middle" font-weight="400">指令室</text><rect x="1393.0" y="422" width="60" height="76" fill="#e7ecd8" stroke="none" stroke-width="1" rx="0"/><text x="1423" y="465" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#192f42" text-anchor="middle" font-weight="400">弾薬庫D</text><rect x="1461.0" y="422" width="44" height="76" fill="#d4e7ef" stroke="none" stroke-width="1" rx="0"/><text x="1483" y="465" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#192f42" text-anchor="middle" font-weight="400">D</text><text x="1111" y="375" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#192f42" text-anchor="middle" font-weight="400">入口</text><rect x="560" y="250" width="480" height="230" fill="#eee7d5" stroke="#c3b699" stroke-width="2" rx="14"/><text x="800" y="329" font-family="Noto Sans CJK JP, sans-serif" font-size="32" fill="#192f42" text-anchor="middle" font-weight="700">中央の広場</text><text x="800" y="372" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#192f42" text-anchor="middle" font-weight="400">地上戦 / 上空に砲撃</text><path d="M520,406 L710,406" stroke="#397d9f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1080,444 L890,444" stroke="#397d9f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="47" y="554" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#192f42" text-anchor="start" font-weight="400">核 ┃7門┃ 復活室 → 中央通路 → 正面出口</text><text x="1545" y="554" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#192f42" text-anchor="end" font-weight="400">正面出口 ← 中央通路 ← 復活室 ┃7門┃ 核</text><text x="50" y="635" font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#192f42" text-anchor="start" font-weight="700">自陣を90度右回転した採用配置から、敵陣の地形と設備を左右反転する。</text><text x="50" y="680" font-family="Noto Sans CJK JP, sans-serif" font-size="19" fill="#192f42" text-anchor="start" font-weight="400">自陣前方の砲台A/B・弾薬庫A/B、後方のC/Dを敵側でも正面基準で再ラベルする。文字や操作は反転しない。</text><text x="50" y="725" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#192f42" text-anchor="start" font-weight="400">部屋・人物・弾・復活予定は陣営ごとに独立管理。図は配置の補助で、当たり判定・実機性能・添付プレビューの検証結果ではない。</text></svg>
