 font-size="14" text-anchor="middle">庫D</text><text x="1115" y="465" font-family="Noto Sans CJK JP, sans-serif" font-size="14" text-anchor="middle">砲D</text><rect x="560" y="250" width="480" height="230" fill="#eee7d5" stroke="#c3b699" stroke-width="2" rx="14"/><text x="800" y="329" font-family="Noto Sans CJK JP, sans-serif" font-size="32" fill="#192f42" text-anchor="middle" font-weight="700">中央の広場</text><text x="800" y="372" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#192f42" text-anchor="middle">地上戦 / 上空に砲撃</text><path d="M520,406 L710,406" stroke="#397d9f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1080,444 L890,444" stroke="#397d9f" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="47" y="554" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#192f42">核 ┃7門┃ 復活室 → 正面出口</text><text x="1545" y="554" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#192f42" text-anchor="end">正面出口 ← 復活室 ┃7門┃ 核</text><text x="50" y="635" font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#192f42" font-weight="700">自陣を90度右回転した採用配置から、敵陣の地形と設備を左右反転する。</text><text x="50" y="680" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#192f42">部屋名や操作を反転しない。損傷・門・人物・弾・復活予定は陣営ごとに独立して管理する。</text><text x="50" y="730" font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#192f42">核や門の省略を仕様撤回とは扱わない。</text></svg>
