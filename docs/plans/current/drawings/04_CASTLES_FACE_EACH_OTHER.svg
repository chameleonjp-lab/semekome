<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img"><title>04 / 自陣 → 広場 ← 敵陣 / 第5版</title><desc>採用した対向配置。自陣は左で正面右、敵陣は右で正面左。両城とも正面から中央通路、後方復活室、直列7門、核室の順で、敵側は左右反転する。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#397d9f"/></marker></defs><rect x="0" y="0" width="1600" height="790" fill="#f4f7fa"/><rect x="0" y="0" width="1600" height="80" fill="#192f42"/><text x="30" y="49" font-family="Noto Sans CJK JP, sans-serif" font-size="28" fill="#fff" font-weight="700">04 / 自陣 → 広場 ← 敵陣 / 第5版</text><text x="30" y="115" font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#192f42">採用配置。自陣の正面は右、敵陣の正面は左。核と7門は添付原画に省略されているため、補足構造として両城の後方へ残す。</text><text x="50" y="182" font-family="Noto Sans CJK JP, sans-serif" font-size="25" fill="#192f42" font-weight="700">自陣：正面は右</text><text x="1550" y="182" font-family="Noto Sans CJK JP, sans-serif" font-size="25" fill="#192f42" text-anchor="end" font-weight="700">敵陣：正面は左</text><rect x="35" y="230" width="504" height="280" fill="#c7d1d8" stroke="none" stroke-width="1" rx="0"/><rect x="39" y="338" width="48" height="64" fill="#ffe6af" stroke="none" stroke-width="1" rx="0"/><text x="63.0" y="376.0" font-family="Noto Sans CJK JP, sans-serif" font-size="16" fill="#192f42" text-anchor="middle" font-weight="400">核</text><rect x="93" y="330" width="44" height="80" fill="#e7def1" stroke="none" stroke-width="1" rx="0"/><text x="115.0" y="376.0" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#192f42" text-anchor="middle" font-weight="400">7門</text><rect x="147" y="330" width="86" height="80" fill="#e3f0ea" stroke="none" stroke-width="1" rx="0"/><text x="190.0" y="376.0" font-family="Noto Sans CJK JP, sans-serif" font-size="16" fill="#192f42" text-anchor="middle" font-weight="400">復活室</text><rect x="245" y="330" width="165" height="80" fill="#fff" stroke="none" stroke-width="1" rx="0"/><text x="327.5" 